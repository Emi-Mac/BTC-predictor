# ============================================================
# Alembic Configuration — BTC Predictor Backend
# ============================================================

[alembic]
script_location = migrations
prepend_sys_path = .

# La URL se lee desde la variable de entorno para no hardcodear credenciales
# Alembic la recibe vía env.py
sqlalchemy.url = driver://user:pass@localhost/dbname  # Placeholder, ver env.py

[post_write_hooks]
# Aplica ruff-format a cada migración generada automáticamente
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

