[project]
name = "btc-predictor-ml"
version = "0.1.0"
description = "BTC Direction Predictor — ML Pipeline"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b0",
    "pyarrow>=16.0.0",
    # HTTP
    "httpx>=0.27.0",
    "tenacity>=8.3.0",          # Retry con backoff exponencial
    # Finance data
    "yfinance>=0.2.40",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # ML
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "torch>=2.3.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxmltools>=1.13.0",
    "skl2onnx>=1.17.0",
    # Interpretability
    "shap>=0.45.0",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    # Scheduling
    "apscheduler>=3.10.4",
    # Logging
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ─── Ruff ───────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "TCH", # flake8-type-checking
]
ignore = ["ANN101", "ANN102", "S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"notebooks/**" = ["ALL"]

# ─── Mypy ───────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "migrations/"]

# ─── Pytest ─────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]
